<style>
  /* ---- Gallery mode: a dark, moody re-skin so the frames and art pop.
     Scoped to this page only via a :root override that loads after the
     shared stylesheet — nothing else in the shell is touched. ---- */
  :root {
    --surface-0: #0a0908;
    --surface-1: #151311;
    --surface-2: #1d1a17;
    --text-primary: #f3ede0;
    --text-secondary: #a89e8c;
    --text-muted: #756c5d;
    --border: #322c24;
    --accent: #F4A261;
    --accent-contrast: #2e2622;
    --accent-soft: #40291a;
  }
  body { font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif; }
  .wall-title, h1.pack-title {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
  }
  .wall-title { font-size: 30px; margin: 1rem 0 0; text-align: center; letter-spacing: 0.01em; }
  .wall-sub { text-align: center; font-size: 14px; color: var(--text-secondary); max-width: 480px; margin: 8px auto 1.75rem; }

  /* ---- The Gallery — a static, wrapping grid. No auto-scroll (it got
     clunky as the gallery grew), and cards sized to stay legible on
     mobile instead of the old 128px "postage stamp" size. ---- */
  .wall-loading, .wall-empty { text-align: center; color: var(--text-secondary); font-size: 13px; padding: 2rem 1rem; white-space: normal; grid-column: 1 / -1; }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 16px;
    padding: 4px 0 1.5rem;
  }
  @media (min-width: 640px) {
    .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 22px; }
  }

  .gallery-card {
    display: flex;
    flex-direction: column;
    cursor: pointer;
    outline: none;
    border-radius: 14px;
    background: var(--surface-2);
    border: 0.5px solid var(--border);
    overflow: hidden;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .gallery-card:hover, .gallery-card:focus-visible {
    transform: translateY(-3px);
    box-shadow: 0 10px 26px rgba(0,0,0,.4);
  }
  .gallery-card img {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    background: var(--surface-1);
  }
  .gallery-card figcaption {
    padding: 9px 11px 11px;
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.4;
  }

  /* ---- Share Your Art call-to-action ---- */
  .pill-cta-wrap { display: flex; justify-content: center; margin: 0.5rem 0 2rem; }
  .pill-cta {
    display: inline-flex; align-items: center; gap: 8px;
    border: none; background: var(--accent); color: var(--accent-contrast);
    border-radius: 999px; padding: 14px 30px; font-size: 15px; font-weight: 700;
    cursor: pointer; min-height: 48px; text-decoration: none;
  }
  .pill-cta:hover { filter: brightness(1.08); }

  /* ---- Lightbox ---- */
  #lightbox {
    position: fixed; inset: 0; background: rgba(4,3,2,.94);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; padding: 24px; z-index: 999;
    touch-action: pan-y; /* let a vertical drag still feel natural; horizontal swipes are read in JS */
  }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 90vw; max-height: 78vh; object-fit: contain; border-radius: 6px; box-shadow: 0 20px 40px rgba(0,0,0,.6); user-select: none; -webkit-user-drag: none; }
  #lightbox-cap { color: #f2ede0; font-size: 13px; margin-top: 14px; text-align: center; max-width: 90vw; }
  #lightbox-counter { color: #a89e8c; font-size: 12px; margin-top: 4px; text-align: center; }
  #lightbox-close {
    position: absolute; top: 16px; right: 16px; min-width: 44px; min-height: 44px;
    border: none; border-radius: 50%; background: rgba(255,255,255,.15); color: #fff;
    font-size: 20px; cursor: pointer; line-height: 1;
  }
  /* Prev/Next — visible tap targets for desktop click, but swipe (below) is
     the primary way to browse on mobile, which is most of this page's
     traffic. Hidden entirely when there's only one piece in the gallery. */
  #lightbox-prev, #lightbox-next {
    position: absolute; top: 50%; transform: translateY(-50%);
    min-width: 48px; min-height: 48px;
    border: none; border-radius: 50%; background: rgba(255,255,255,.15); color: #fff;
    font-size: 26px; cursor: pointer; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  #lightbox-prev { left: 10px; }
  #lightbox-next { right: 10px; }
  #lightbox-prev:hover, #lightbox-next:hover, #lightbox-close:hover { background: rgba(255,255,255,.28); }
  #lightbox.single-item #lightbox-prev,
  #lightbox.single-item #lightbox-next { display: none; }
  @media (max-width: 600px) {
    #lightbox-prev, #lightbox-next { min-width: 44px; min-height: 44px; font-size: 22px; }
  }

  @media (max-width: 480px) {
    .wall-title { font-size: 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .gallery-card { transition: none; }
  }
</style>
</head>
<body>

<div id="sl-header-mount"></div>

<main id="app">
  <h1 class="wall-title">🖼️ Disco Doodle Gallery</h1>
  <p class="wall-sub">Art made from Disco Doodle's prompts, submitted by fellow artists — tap a piece to see it larger.</p>

  <div id="gallery-grid" class="gallery-grid">
    <p class="wall-loading">Loading the gallery…</p>
  </div>

  <div class="pill-cta-wrap">
    <a href="submit.html" class="pill-cta">🎨 Share Your Art</a>
  </div>
  <p style="text-align:center; font-size:12px; color:var(--text-muted); margin:0.5rem 0 1.5rem;">
    See something that shouldn't be here? Email <a href="mailto:abuse@discodoodle.com" style="color:inherit;">abuse@discodoodle.com</a>.
  </p>
</main>

<div id="sl-footer-mount"></div>

<div id="lightbox" aria-hidden="true">
  <button id="lightbox-close" type="button" aria-label="Close">✕</button>
  <button id="lightbox-prev" type="button" aria-label="Previous piece">‹</button>
  <button id="lightbox-next" type="button" aria-label="Next piece">›</button>
  <img id="lightbox-img" alt="">
  <p id="lightbox-cap"></p>
  <p id="lightbox-counter"></p>
</div>

<script>
  window.SL_PAGE = 'gallery';
  window.SL_PACK_LIST = [
    { id: 'dailydoodle', label: 'Daily Doodle', src: '../assets/packs/dailydoodle.js' },
    { id: 'monstermaker', label: 'Monster Maker', src: '../assets/packs/monstermaker.js' },
    { id: 'themepark', label: 'Theme Park Edition', src: '../assets/packs/themepark.js' }
  ];
</script>
<script src="../assets/header.js" defer></script>
<script src="../assets/footer.js" defer></script>
<script defer>
(function () {
  var DB_URL = 'https://daily-doodle-b7c57-default-rtdb.firebaseio.com';

  function $(id) { return document.getElementById(id); }

  function formatDate(ts) {
    if (!ts) return '';
    try {
      return new Date(ts).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    } catch (e) { return ''; }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ---- Lightbox ----
  // Entries + the currently-open index live up here (not inside loadGallery's
  // fetch callback) so navigation functions can reach them too.
  var lightbox = $('lightbox');
  var entries = [];
  var currentIndex = -1;

  function showLightboxAt(idx) {
    if (!entries.length) return;
    // Wrap around both directions — swiping past the last piece loops back
    // to the first, which is the more natural feel for browsing than a dead end.
    currentIndex = ((idx % entries.length) + entries.length) % entries.length;
    var entry = entries[currentIndex];
    $('lightbox-img').src = entry.imageUrl;
    $('lightbox-img').alt = (entry.name || 'Anonymous Artist') + "'s " + (entry.pack || 'Disco Doodle') + ' creation';
    $('lightbox-cap').textContent = (entry.name || 'Anonymous Artist') + ' · ' + (entry.pack || 'Disco Doodle') + ' · ' + formatDate(entry.submittedAt);
    $('lightbox-counter').textContent = entries.length > 1 ? (currentIndex + 1) + ' / ' + entries.length : '';
    lightbox.classList.toggle('single-item', entries.length <= 1);
    lightbox.classList.add('open');
    lightbox.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }
  function openLightbox(idx) { showLightboxAt(idx); }
  function closeLightbox() {
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden', 'true');
    $('lightbox-img').src = '';
    currentIndex = -1;
    document.body.style.overflow = '';
  }
  function nextImage() { showLightboxAt(currentIndex + 1); }
  function prevImage() { showLightboxAt(currentIndex - 1); }

  $('lightbox-close').addEventListener('click', closeLightbox);
  $('lightbox-prev').addEventListener('click', function (e) { e.stopPropagation(); prevImage(); });
  $('lightbox-next').addEventListener('click', function (e) { e.stopPropagation(); nextImage(); });
  lightbox.addEventListener('click', function (e) { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', function (e) {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowRight') nextImage();
    else if (e.key === 'ArrowLeft') prevImage();
  });

  // Swipe left/right — the intuitive way to browse on mobile, which is most
  // of this page's real-world traffic. A tap (near-zero movement) is left
  // alone so it still falls through to the close-on-backdrop-click handler
  // above; only a real horizontal drag counts as a swipe.
  var touchStartX = null, touchStartY = null;
  lightbox.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  lightbox.addEventListener('touchend', function (e) {
    if (touchStartX === null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStartX;
    var dy = t.clientY - touchStartY;
    touchStartX = null; touchStartY = null;
    if (Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy) * 1.5) return; // not a real horizontal swipe
    if (dx < 0) nextImage(); else prevImage();
  }, { passive: true });

  // ---- The Gallery — approved submissions only, static wrapping grid ----
  function loadGallery() {
    var grid = $('gallery-grid');
    fetch(DB_URL + '/approvedWall.json')
      .then(function (res) { return res.json(); })
      .then(function (data) {
        entries = data ? Object.keys(data).map(function (k) { return Object.assign({ id: k }, data[k]); }) : [];
        entries.sort(function (a, b) { return (b.submittedAt || 0) - (a.submittedAt || 0); });
        if (entries.length === 0) {
          grid.innerHTML = '<p class="wall-empty">No art in the gallery yet — be the first to submit!</p>';
          return;
        }
        grid.innerHTML = entries.map(function (e, i) {
          var caption = escapeHtml(e.name || 'Anonymous Artist') + ' · ' + escapeHtml(e.pack || 'Disco Doodle') + ' · ' + formatDate(e.submittedAt);
          var alt = escapeHtml((e.name || 'Anonymous Artist') + "'s " + (e.pack || 'Disco Doodle') + ' creation');
          return (
            '<figure class="gallery-card" tabindex="0" role="button" aria-label="View ' + alt + ' full size" data-idx="' + i + '">' +
              '<img src="' + e.imageUrl + '" loading="lazy" alt="' + alt + '">' +
              '<figcaption>' + caption + '</figcaption>' +
            '</figure>'
          );
        }).join('');

        grid.addEventListener('click', function (e) {
          var card = e.target.closest('.gallery-card');
          if (card) openLightbox(Number(card.getAttribute('data-idx')));
        });
        grid.addEventListener('keydown', function (e) {
          if (e.key !== 'Enter' && e.key !== ' ') return;
          var card = e.target.closest('.gallery-card');
          if (card) { e.preventDefault(); openLightbox(Number(card.getAttribute('data-idx'))); }
        });
      })
      .catch(function (err) {
        console.error('Gallery load failed:', err);
        grid.innerHTML = '<p class="wall-empty">Could not load the gallery right now. Try refreshing.</p>';
      });
  }

  loadGallery();
})();
</script>

</body>
</html>
