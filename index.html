<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "https://discodoodle.com/#organization",
      "name": "Disco Doodle",
      "url": "https://discodoodle.com/",
      "logo": "https://discodoodle.com/android-chrome-512x512.png",
      "parentOrganization": {
        "@type": "Organization",
        "name": "Plaid Labs"
      }
    },
    {
      "@type": "WebSite",
      "@id": "https://discodoodle.com/#website",
      "url": "https://discodoodle.com/",
      "name": "Disco Doodle",
      "description": "Free, no-signup drawing-prompt generators — Daily Doodle, Monster Maker, and Theme Park Edition.",
      "publisher": { "@id": "https://discodoodle.com/#organization" },
      "inLanguage": "en"
    }
  ]
}
</script>
</head>
<body>

<div id="sl-header-mount"></div>

<main id="app" aria-live="polite">
  <!-- Populated by assets/engine.js once the default pack loads -->
</main>

<div id="sl-footer-mount"></div>

<script>
  // Lightweight pack manifest — just id/label/src, so the header's pack
  // selector can render instantly. Each pack's actual category data is only
  // fetched when the user selects it (Theme Park Edition's data set is the
  // largest, so this keeps first paint fast).
  window.SL_PACK_LIST = [
    { id: 'dailydoodle', label: 'Daily Doodle', src: 'assets/packs/dailydoodle.js' },
    { id: 'monstermaker', label: 'Monster Maker', src: 'assets/packs/monstermaker.js' },
    { id: 'themepark', label: 'Theme Park Edition', src: 'assets/packs/themepark.js' }
  ];
</script>
<script src="assets/header.js" defer></script>
<script src="assets/footer.js" defer></script>
<script src="assets/holiday-data.js" defer></script>
<script src="assets/engine.js" defer></script>
<script defer>
  document.addEventListener('DOMContentLoaded', function () {
    // Daily Doodle is the main/landing theme pack of Disco Doodle.
    window.SL_boot('dailydoodle');
  });
</script>

</body>
</html>
